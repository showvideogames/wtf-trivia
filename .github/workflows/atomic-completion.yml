name: Atomic completion database tests
on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'tests/db/**'
      - 'package*.json'
      - '.github/workflows/atomic-completion.yml'
concurrency:
  group: wtf-local-database-tests
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start -x realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,studio,postgres-meta
      - run: npm run db:reset
      - run: npm run test:db
      - if: always()
        run: npm run db:stop
